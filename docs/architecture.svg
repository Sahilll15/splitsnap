<title id="t">SplitSnap architecture</title>
<desc id="d">The browser shrinks a receipt photo and posts it to one Vercel route, which checks a per IP limit in Upstash Redis and then reads the receipt with the OpenAI Responses API. The maths, the split and the share link all run in the browser.</desc>
